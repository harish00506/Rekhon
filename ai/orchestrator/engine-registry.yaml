# =============================================================================
# Engine Registry — the catalogue of AI engines the orchestrator can run.
#
# Why:  AI-ARC-006 requires every stored result to name the engine + version that
#       produced it. That is only possible if there is one authoritative list of
#       engines, their versions, layers, and contracts. This is that list.
# What: One row per engine (module :domain:engines:*), with its layer, one-line
#       input→output contract, the rulebook/KB files it reads, and its version.
# Result: The orchestrator and provenance stamping resolve engine metadata from here;
#         reviewers see every AI capability and where its logic/data lives.
# Changelog:
#   2026-07-17 — Created from SRS v1.7 §7, §21.2 (module list) and the engine sections.
#   2026-09-19 — Issue 9.1: AI-CLS.stream — Stage 2 has its own module and version (ADR-0042).
#   2026-09-19 — Issue 9.2: AI-FCT built; its contract and inputs restated (ADR-0043).
#   2026-09-19 — Issue 9.3: AI-SEAS built; AI-FCT 1.1 applies its monthly factor (ADR-0044).
#   2026-09-20 — Issue 9.4: AI-FHS built; its contract and the signals it reads restated (ADR-0045).
#   2026-09-20 — Issue 9.5: AI-ORCH built — the L5 assembly step of insight-orchestrator.yaml's
#                pipeline, plus the persisted feed it writes (ADR-0046).
# =============================================================================

version: "1.1"
source_section: "§7, §21.2"

# Provenance every engine result MUST carry (AI-ARC-003):
provenance_contract:
  fields: [engineId, engineVersion, inputWindow, computedAt, confidence, evidence]

engines:
  - id: AI-CLS
    name: Fixed/Variable + Nature Classification
    layer: L2
    module: ":domain:engines:classification"
    version: "1.0"
    contract: "transactions + corrections -> {classification, nature} per txn/stream"
    reads: [../knowledge/classification-kb.json]
    srs: "§8"

  # Stage 2 of AI-CLS (§8.2): its own module, so its version moves independently of Stage 1's
  # category assignment (AI-ARC-006). The id is what every StreamVerdict's provenance carries.
  - id: AI-CLS.stream
    name: Stream Classification (AI-CLS Stage 2)
    layer: L2
    module: ":domain:engines:stream"
    version: "1.0"
    contract: "expense streams (per category, last 6 closed months) -> {FIXED|SEMI_FIXED|VARIABLE, score, evidence} + FixedLoad/SemiFixedExpected/VariableBudgetable"
    reads: [../knowledge/classification-kb.json]
    srs: "§8.2"

  - id: AI-FCT
    name: Cash-Flow Forecasting
    layer: L4
    module: ":domain:engines:forecast"
    version: "1.1"
    # Issue 9.2 built it (ADR-0043): §9.2's heuristic method; reads its parameters from the rulebook.
    # 1.1 (issue 9.3, ADR-0044): §9.2's seasonalAdjustment(d) — AI-SEAS's monthly factor on each
    # day's predicted spend. It reads the calendar file only through AI-SEAS's result.
    contract: "opening balance + scheduled items (confirmed rules, FIXED streams, future-dated) + daily everyday spend + AI-SEAS factors -> CashFlowForecast{P10,P50,P90 per day, crunch days, components, seasonal term per month}"
    reads: [../rules/rules-kb.json]
    depends_on: [AI-SEAS]
    srs: "§9"

  - id: AI-SEAS
    name: Seasonality Prediction
    layer: L4
    module: ":domain:engines:seasonality"
    version: "1.0"
    # Issue 9.3 built it (ADR-0044): §9.3's median index, own history first, calendar priors
    # otherwise, shrunk by k = months/24; the forecast's factor divides out the lookback's season.
    contract: "closed-month category history + the lookback's everyday spend per category + calendar -> seasonal index per category/month + one everyday-spend factor per month, with the events named"
    reads: [../knowledge/calendar-seasonality.json]       # events + SEAS-INDEX (method block)
    srs: "§9.3"

  - id: AI-ORCH
    name: Insight Orchestrator
    layer: L5
    module: ":domain:engines:insight"
    version: "1.0"
    # Issue 9.5 built the assembly step (ADR-0046): it ranks what the engines below it published and
    # computes nothing itself. The pipeline's stages 1–4 are those engines' own repositories; stage 5
    # (persist) is `insight` at schema 23; stage 6 (notify) is AI-NTF's, and waits for issue 9.6.
    contract: "published engine results (forecast, emergency fund, health score, budgets, goals) -> ranked, fingerprinted insights {severity, figures, source engine, rules} + the dashboard's top 3"
    reads: [../rules/rules-kb.json, insight-orchestrator.yaml]   # RULE-INS-RANK, RULE-INS-DEDUP
    depends_on: [AI-FCT, AI-FHS, AI-EMF, AI-GOAL]
    srs: "§7.2"

  - id: AI-EMF
    name: Emergency Fund
    layer: L4
    module: ":domain:engines:emergencyfund"
    version: "1.0"
    contract: "essentials + income volatility -> {target, runwayMonths, multiplier M}"
    reads: [../rules/rules-kb.json]      # RULE-EMF-MULT, RULE-EMF-COACH, RULE-RUNWAY-M (clamp)
    srs: "§10"

  - id: AI-INV
    name: Investment Intelligence
    layer: L3/L4
    module: ":domain:engines:investment"
    version: "1.1"
    contract: "holdings -> {allocation, diversification, XIRR, rebalancing signal}"
    reads: [../rules/rules-kb.json]      # RULE-AGE-EQUITY, RULE-5-25, caps
    srs: "§11"

  - id: AI-VEH
    name: Vehicle & Appliance Maintenance Prediction
    layer: L4
    module: ":domain:engines:vehicle"
    version: "1.0"
    contract: "odometer + service history -> {nextService.dueAt, predictedCost, alerts}"
    reads: [../knowledge/vehicle-maintenance-kb.json]
    srs: "§12"

  - id: AI-PA
    name: Purchase Advisor Decision Engine
    layer: L5
    module: ":domain:engines:purchase"
    version: "1.0"
    contract: "item+price+method -> Verdict{COMFORTABLE|STRETCH|NOT_NOW} + gate trace"
    reads: [../rules/rules-kb.json]      # RULE-EMI-40, RULE-COOL-OFF, RULE-20-4-10 ...
    srs: "§13"

  - id: AI-STS
    name: Safe-to-Spend
    layer: L5
    module: ":domain:engines:safetospend"
    version: "1.0"
    contract: "income + commitments -> {safeToSpend, ordered breakdown lines} (signed paise)"
    reads: [../rules/rules-kb.json]      # RULE-STS
    srs: "§5.2, §14"

  - id: AI-FHS
    name: Financial Health Score
    layer: L3
    module: ":domain:engines:healthscore"
    version: "1.0"
    # Issue 9.4 built it (ADR-0045): six measured signals on straight lines between rulebook
    # anchors; a pillar with no signal is "—" and its weight is shared out. Deltas need stored
    # snapshots and are deferred with §14's weekly cadence.
    contract: "six optional signals (runway/M, obligations÷income, card statement utilisation, savings rate, budget adherence, goals on track) -> {total 0..1000, band, five pillars with contributions, the biggest lever}"
    reads: [../rules/rules-kb.json]      # RULE-FHS-PILLARS/BANDS/SIGNALS + RULE-CC-UTIL, RULE-SAVE-RATE
    depends_on: [AI-EMF, AI-CLS.stream]
    srs: "§14"

  - id: AI-GOAL
    name: Goal Planning
    layer: L4/L5
    module: ":domain:engines:goals"
    version: "1.1"
    # Shipped at issue 7.1; feasibility added at 7.3 as a second engine in the same module,
    # `AI-GOAL.waterfall`, because it is only meaningful over this one's output and reuses its types.
    # 1.1 at issue 7.4: `saved` arrives split into an evidenced and a declared half, and a plan can
    # carry RULE-PAY-FIRST's anchor day. Every figure 1.0 computed is computed identically — what
    # changed is what the input can say (ADR-0036), which is why old results stay reproducible
    # (AI-ARC-006).
    # Three rules consumed, all of which named AI-GOAL before any engine existed: RULE-HORIZON
    # (AI-GOAL.funding_buckets, 7.1), RULE-EMERG-FIRST (the waterfall's gate, 7.3) and
    # RULE-PAY-FIRST (the contribution anchor, 7.4). No issue minted a row.
    # financial-order-of-operations.json used to be listed here too, but this engine never read it:
    # §15's simple waterfall is what 7.3 built, and §36's staged one is AI-FOO, a separate engine that
    # composes this one (7.5, ADR-0037).
    contract: "goals -> {requiredMonthly, shortfall, ETA, horizon, status per goal, savedEvidenced/savedDeclared}"
    reads: [../rules/rules-kb.json]
    srs: "§15"

  - id: AI-GOAL.waterfall
    name: Goal Feasibility & Contribution Waterfall
    layer: L5
    module: ":domain:engines:goals"
    version: "1.0"
    # §15.1 asks for the P50 *forecast* surplus and AI-FCT does not exist — :domain:engines:forecast
    # is still issue 1.1's placeholder. GoalWaterfallRepository substitutes the P50 of *observed*
    # surplus (median of income − needs − wants over closed months) and names the substitution on
    # every result through SurplusBasis. ADR-0035 records what changes when 9.2 lands.
    contract: "goals + surplus + runway -> {feasibility, gap, per-goal allocation, 3 levers each}"
    reads: [../rules/rules-kb.json]      # RULE-EMERG-FIRST — the citation; the threshold is an input
    srs: "§15.1, FR-GOAL-003, FR-GOAL-005"

  - id: AI-FOO
    name: Financial Order of Operations (Priority Waterfall)
    layer: L5
    module: ":domain:engines:orderofoperations"
    version: "1.0"
    # Shipped at issue 7.5. The module was pre-registered here as `:domain:engines:orchestrator`, but
    # that name is AI-ORCH's (insight-orchestrator.yaml), so it was built as `orderofoperations`
    # (ADR-0037). Reads the FOO file as its rule set — a typed mirror, each stage cited as FOO.<id> —
    # and cites RULE-EMERG-FIRST (Stage 3's gate), RULE-HORIZON (Stage 5) and RULE-PREPAY-VS-INVEST
    # (Stage 7) without mirroring any of them. No rulebook row minted. The surplus is
    # AI-GOAL.waterfall's own figure (ADR-0035's observed-P50 stand-in for the forecast issue 9.2
    # never built). Stages 1 and 4 are always skipped with reasons (no EPF data; no §38 comparator,
    # 13.4); Stage 7 defers to the unbuilt simulator (10.3) with no amount.
    contract: "surplus + emergency fund + debts + goals -> eight ranked stages {status, need, amount, reason, debts, citations}, top action, unallocated"
    reads: [../rules/financial-order-of-operations.json, ../rules/rules-kb.json]
    srs: "§36, FOO-001, FOO-002, FOO-003"

  - id: AI-MKT
    name: Market Signal Engine (Opportunity Detection)
    layer: L4/L5
    module: ":domain:engines:marketsignal"
    version: "1.0"
    contract: "OHLC history + capacity -> OpportunityScore + verdict + backtest line"
    reads: [../knowledge/market-signals.json, ../rules/rules-kb.json]
    srs: "§30"

  - id: AI-TAX
    name: Tax Engine v2
    layer: L3/L5
    module: ":domain:engines:growth"
    version: "fy2025-26"
    contract: "salary + deductions + lots -> {regime comparison, harvesting alerts}"
    reads: [../knowledge/tax-kb-fy2025-26.json]
    srs: "§38"

  - id: AI-CHAT
    name: Chat Assistant (verbaliser)
    layer: L6
    module: ":feature:chat + :ml:llm"
    version: "1.0"
    contract: "NL intent -> tool calls -> structured results -> guardrailed reply"
    reads: [../skills/tool-registry.json, ../chat/system-prompt.md, ../chat/guardrail.md]
    srs: "§19"
