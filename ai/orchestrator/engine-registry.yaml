# =============================================================================
# Engine Registry — the catalogue of AI engines the orchestrator can run.
#
# Why:  AI-ARC-006 requires every stored result to name the engine + version that
#       produced it. That is only possible if there is one authoritative list of
#       engines, their versions, layers, and contracts. This is that list.
# What: One row per engine (module :domain:engines:*), with its layer, one-line
#       input→output contract, the rulebook/KB files it reads, and its version.
# Result: The orchestrator and provenance stamping resolve engine metadata from here;
#         reviewers see every AI capability and where its logic/data lives.
# Changelog:
#   2026-07-17 — Created from SRS v1.7 §7, §21.2 (module list) and the engine sections.
# =============================================================================

version: "1.0"
source_section: "§7, §21.2"

# Provenance every engine result MUST carry (AI-ARC-003):
provenance_contract:
  fields: [engineId, engineVersion, inputWindow, computedAt, confidence, evidence]

engines:
  - id: AI-CLS
    name: Fixed/Variable + Nature Classification
    layer: L2
    module: ":domain:engines:classification"
    version: "1.0"
    contract: "transactions + corrections -> {classification, nature} per txn/stream"
    reads: [../knowledge/classification-kb.json]
    srs: "§8"

  - id: AI-FCT
    name: Cash-Flow Forecasting
    layer: L4
    module: ":domain:engines:forecast"
    version: "1.0"
    contract: "FeatureSnapshot -> Forecast{P10,P50,P90 per day, crunch days}"
    reads: [../knowledge/calendar-seasonality.json]
    srs: "§9"

  - id: AI-SEAS
    name: Seasonality Prediction
    layer: L4
    module: ":domain:engines:seasonality"
    version: "1.0"
    contract: "category history + calendar -> seasonal index per category/month"
    reads: [../knowledge/calendar-seasonality.json]
    srs: "§9.3"

  - id: AI-EMF
    name: Emergency Fund
    layer: L4
    module: ":domain:engines:emergencyfund"
    version: "1.0"
    contract: "essentials + income volatility -> {target, runwayMonths, multiplier M}"
    reads: [../rules/rules-kb.json]      # RULE-EMF-MULT, RULE-EMF-COACH, RULE-RUNWAY-M (clamp)
    srs: "§10"

  - id: AI-INV
    name: Investment Intelligence
    layer: L3/L4
    module: ":domain:engines:investment"
    version: "1.1"
    contract: "holdings -> {allocation, diversification, XIRR, rebalancing signal}"
    reads: [../rules/rules-kb.json]      # RULE-AGE-EQUITY, RULE-5-25, caps
    srs: "§11"

  - id: AI-VEH
    name: Vehicle & Appliance Maintenance Prediction
    layer: L4
    module: ":domain:engines:vehicle"
    version: "1.0"
    contract: "odometer + service history -> {nextService.dueAt, predictedCost, alerts}"
    reads: [../knowledge/vehicle-maintenance-kb.json]
    srs: "§12"

  - id: AI-PA
    name: Purchase Advisor Decision Engine
    layer: L5
    module: ":domain:engines:purchase"
    version: "1.0"
    contract: "item+price+method -> Verdict{COMFORTABLE|STRETCH|NOT_NOW} + gate trace"
    reads: [../rules/rules-kb.json]      # RULE-EMI-40, RULE-COOL-OFF, RULE-20-4-10 ...
    srs: "§13"

  - id: AI-STS
    name: Safe-to-Spend
    layer: L5
    module: ":domain:engines:safetospend"
    version: "1.0"
    contract: "income + commitments -> {safeToSpend, ordered breakdown lines} (signed paise)"
    reads: [../rules/rules-kb.json]      # RULE-STS
    srs: "§5.2, §14"

  - id: AI-FHS
    name: Financial Health Score
    layer: L3
    module: ":domain:engines:healthscore"
    version: "1.0"
    contract: "FeatureSnapshot -> {total 0..1000, five weighted pillars, deltas}"
    reads: [../rules/rules-kb.json]
    srs: "§14"

  - id: AI-GOAL
    name: Goal Planning
    layer: L4/L5
    module: ":domain:engines:goals"
    version: "1.0"
    # Shipped at issue 7.1; feasibility added at 7.3 as a second engine in the same module,
    # `AI-GOAL.waterfall`, because it is only meaningful over this one's output and reuses its types.
    # Two rules consumed, both of which named AI-GOAL before either engine existed: RULE-HORIZON
    # (AI-GOAL.funding_buckets) and RULE-EMERG-FIRST (the waterfall's gate). Neither issue minted a
    # row. financial-order-of-operations.json is still listed for 7.5's AI-FOO and is NOT read yet:
    # §15's simple waterfall is what 7.3 built, and §36's staged one is a separate engine.
    contract: "goals -> {requiredMonthly, shortfall, ETA, horizon, status per goal}"
    reads: [../rules/rules-kb.json, ../rules/financial-order-of-operations.json]
    srs: "§15"

  - id: AI-GOAL.waterfall
    name: Goal Feasibility & Contribution Waterfall
    layer: L5
    module: ":domain:engines:goals"
    version: "1.0"
    # §15.1 asks for the P50 *forecast* surplus and AI-FCT does not exist — :domain:engines:forecast
    # is still issue 1.1's placeholder. GoalWaterfallRepository substitutes the P50 of *observed*
    # surplus (median of income − needs − wants over closed months) and names the substitution on
    # every result through SurplusBasis. ADR-0035 records what changes when 9.2 lands.
    contract: "goals + surplus + runway -> {feasibility, gap, per-goal allocation, 3 levers each}"
    reads: [../rules/rules-kb.json]      # RULE-EMERG-FIRST — the citation; the threshold is an input
    srs: "§15.1, FR-GOAL-003, FR-GOAL-005"

  - id: AI-FOO
    name: Financial Order of Operations (Priority Waterfall)
    layer: L5
    module: ":domain:engines:orchestrator"
    version: "1.0"
    contract: "surplus -> ranked next-best-rupee cards with stage + evidence"
    reads: [../rules/financial-order-of-operations.json]
    srs: "§36"

  - id: AI-MKT
    name: Market Signal Engine (Opportunity Detection)
    layer: L4/L5
    module: ":domain:engines:marketsignal"
    version: "1.0"
    contract: "OHLC history + capacity -> OpportunityScore + verdict + backtest line"
    reads: [../knowledge/market-signals.json, ../rules/rules-kb.json]
    srs: "§30"

  - id: AI-TAX
    name: Tax Engine v2
    layer: L3/L5
    module: ":domain:engines:growth"
    version: "fy2025-26"
    contract: "salary + deductions + lots -> {regime comparison, harvesting alerts}"
    reads: [../knowledge/tax-kb-fy2025-26.json]
    srs: "§38"

  - id: AI-CHAT
    name: Chat Assistant (verbaliser)
    layer: L6
    module: ":feature:chat + :ml:llm"
    version: "1.0"
    contract: "NL intent -> tool calls -> structured results -> guardrailed reply"
    reads: [../skills/tool-registry.json, ../chat/system-prompt.md, ../chat/guardrail.md]
    srs: "§19"
