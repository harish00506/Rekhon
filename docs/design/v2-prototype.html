<title>Rekhon Prototype</title>

<style>

<script>
/* ---------------------------------------------------------------------------
   Money and time. Paise as integers, exactly like the app (MNY-001), and a
   fixed "today" so the prototype looks identical every time it is opened.
--------------------------------------------------------------------------- */
const TODAY = { day: 13, days: 31, label: 'Tue 13 Oct', month: 'October', monthEnd: '31 October' };

/** Indian digit grouping: 1,23,456.78 from 12345678 paise. */
function money(paise, opts = {}) {
  const sign = paise < 0 ? '-' : '';
  const abs = Math.abs(Math.round(paise));
  const rupees = String(Math.floor(abs / 100));
  const p = String(abs % 100).padStart(2, '0');
  let head = rupees.slice(0, -3), tail = rupees.slice(-3);
  if (head) head = head.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
  const body = (head || '') + (rupees.length > 3 ? tail : rupees);
  return sign + '₹' + body + (opts.whole ? '' : '.' + p);
}
/** Rounded to the rupee — allowed for display, never for storage. */
const moneyR = (paise) => money(Math.round(paise / 100) * 100, { whole: true });
const pct = (part, whole) => whole === 0 ? 0 : Math.round((part / whole) * 100);

/* ---------------------------------------------------------------------------
   The seed. One household's October, 13 days in.
--------------------------------------------------------------------------- */

      { d: 9, merchant: 'Decathlon', cat: 'shopping', paise: 320000, acct: 'card', nature: 'Want', src: 'manual' },
      { d: 8, merchant: 'Big Basket', cat: 'groceries', paise: 258000, acct: 'hdfc', nature: 'Need', src: 'receipt' },
      { d: 7, merchant: 'Third Wave Coffee', cat: 'dining', paise: 52000, acct: 'cash', nature: 'Want', src: 'manual' },
      { d: 6, merchant: 'Auto', cat: 'transport', paise: 22000, acct: 'cash', nature: 'Need', src: 'manual' },
      { d: 5, merchant: 'Reliance Fresh', cat: 'groceries', paise: 200000, acct: 'card', nature: 'Need', src: 'sms' },

      items: ['Engine oil · ₹520', 'Air filter · ₹340', 'Labour · ₹450', 'Brake pads (predicted) · ₹590'] },

    insurance: { term: 5000000, termNeed: 12000000, health: 500000, healthNeed: 1000000, endowment: 'One endowment policy detected — 4.1% implied return' },
    tax: { regime: 'New', taxable: 128000000, estimate: 9360000, unused: '80C has ₹42,000 unused', left: 'capital gains and rental income not estimated' },
    market: { index: 'Nifty 50', close: 2461500, score: 72, band: 'better than usual', hit: '58% of 120 past signals', note: 'Cached close from 11 Oct — market data is off, so this is stale.' },
    recurring: [
      { name: 'Rent', amount: 2400000, day: 1, confirmed: true },

      { name: 'Netflix', amount: 64900, day: 19, confirmed: false }
    ],
    categories: [
      { name: 'Dining', nature: 'Want', rules: 'Swiggy, Zomato, Dominos, +4 merchants' },
      { name: 'Groceries', nature: 'Need', rules: 'Big Basket, More, Reliance Fresh' },
      { name: 'Transport', nature: 'Need', rules: 'Uber, Rapido, Namma Metro' },
      { name: 'Health', nature: 'Need', rules: 'Apollo, Cult Fit' }
    ],
    smsQueue: [
      { bank: 'HDFC', text: 'Rs 640.00 debited to SWIGGY on 13-10-26', paise: 64000, cat: 'dining', conf: 'high' },
      { bank: 'ICICI', text: 'Rs 2,100 spent at CROMA on 13-10-26', paise: 210000, cat: 'shopping', conf: 'medium' }
    ],
    receipt: { merchant: 'More Supermarket', total: 184000, date: '12 Oct 2026', gst: 9200, lines: 11, conf: 'total 0.98 · date 0.94 · merchant 0.89' },
    simulator: { prepay: 184000, invest: 236000, verdict: 'Investing wins by ₹520 over 24 months — but only if the 12% assumption holds.' },
    profiles: ['Personal', 'Household', 'Business']
  };
}
let S = seed();

/* ---------------------------------------------------------------------------
   The "engines". Deterministic, and every figure on screen comes from here —
   the same split the real app makes between math and words (P-03).
--------------------------------------------------------------------------- */
const engines = {
  /** Spend per budget, and the whole envelope total. */
  spend() {
    const byCat = {};
    S.budgets.forEach((b) => { byCat[b.id] = 0; });
    S.txns.forEach((t) => { if (byCat[t.cat] !== undefined) byCat[t.cat] += t.paise; });
    const spent = Object.values(byCat).reduce((a, b) => a + b, 0);
    const planned = S.budgets.reduce((a, b) => a + b.planned, 0);
    return { byCat, spent, planned, left: planned - spent, count: S.txns.length };
  },
  /** AI-STS: what is left to spend, and what that is per remaining day. */
  safeToSpend() {
    const { left } = engines.spend();
    const daysLeft = TODAY.days - TODAY.day + 1;
    return { left, daysLeft, perDay: Math.max(0, Math.round(left / daysLeft)) };
  },
  /** FR-ACC-005: assets minus liabilities. */
  netWorth() {
    const own = S.accounts.filter((a) => a.side === 'own').reduce((s, a) => s + a.paise, 0);
    const owe = S.accounts.filter((a) => a.side === 'owe').reduce((s, a) => s + a.paise, 0);
    return { own, owe: Math.abs(owe), total: own + owe, delta: 4125000 };
  },
  /** §5.5: spent, even pace, and where the month lands. */
  pace(budget) {
    const spent = engines.spend().byCat[budget.id] || 0;
    const evenPace = Math.round(budget.planned * (TODAY.day / TODAY.days));
    const lands = Math.round(spent * (TODAY.days / TODAY.day));
    return { spent, evenPace, lands, over: lands > budget.planned };
  },
  /** The one insight the Today screen leads with: the worst-pacing envelope. */
  worstPace() {
    return S.budgets
      .map((b) => ({ budget: b, ...engines.pace(b) }))
      .filter((p) => p.spent > 0)
      .sort((a, b) => (b.lands / b.budget.planned) - (a.lands / a.budget.planned))[0];
  },
  /** §14 AI-FHS, fixed for the prototype. */
  health() { return { score: 712, max: 1000, band: 'Good', lever: 'Dining is the pillar costing you most' }; },
  /** §9 AI-FCT, fixed for the prototype. */
  forecast() { return { horizon: 90, lowest: 214000, on: '3 Nov 2026' }; }
};

/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/** Amounts respect the privacy blur everywhere, including the widget in the real app. */
const amt = (paise, extra = '') => `<span class="amt ${extra} ${S.blur ? 'blurred' : ''}">${money(paise)}</span>`;

/**
 * Navigation. One stack per tab, so depth survives a tab switch the way Android's back stack does —
 * and so `account → holdings → back` returns to the account rather than dumping you on the tab.
 * Everything navigational is `data-nav`; `data-act` is for state changes only. One mechanism is
 * what lets a script prove there are no unreachable screens.
 */
const TABS = ['today', 'money', 'plan', 'ask', 'you'];
let nav = { tab: 'today', stacks: { today: [], money: [], plan: [], ask: [], you: [] } };
const here = () => nav.stacks[nav.tab].at(-1) || { screen: nav.tab, arg: null };
const arg = () => here().arg;

/** Screens with an engine behind them and no route in the app yet (checked against CfoRoute.kt). */
const PROPOSED = new Set(['lock', 'insights', 'health', 'nwhistory', 'txn', 'buylist', 'recurring',

const navTag = (screen) => (PROPOSED.has(screen) ? '<span class="soon">proposed</span>' : '<span class="note">→</span>');

         ${t.chips ? `<div class="chips" style="margin-top:10px">${t.chips.map((c) => `<span class="tag">${esc(c)}</span>`).join('')}</div>` : ''}
         ${t.work ? `<details class="work"><summary>Show the work</summary><dl>${t.work.map((w) => `<dt>${esc(w[0])}</dt><dd>${esc(w[1])}</dd>`).join('')}</dl></details>` : ''}
       </div>`).join('');
  return `
    <div class="appbar"><h2>Ask</h2><span class="note">on-device</span></div>
    ${S.chat.length === 0 ? `<div class="card flat"><p class="name">Ask about your own money.</p><p class="meaning">Every figure comes from an engine and is checked before you see it. The model only writes the words.</p></div>` : turns}
    <div class="chips">
      <button class="chip" data-ask="Where did my money go this month?">Where did it go?</button>
      <button class="chip" data-ask="What is my balance?">My balance</button>
      <button class="chip" data-ask="Can I afford ₹45,000 for a phone?">Can I afford ₹45,000?</button>
      <button class="chip" data-ask="What is my health score?">Health score</button>
      <button class="chip" data-ask="Should I buy RELIANCE?">Should I buy RELIANCE?</button>
    </div>
    <form class="asker" data-act="ask-form">
      <input id="ask-input" placeholder="Ask anything about your money" autocomplete="off">
      <button class="chip on" type="submit">Ask</button>
    </form>`;
}

/* ---- pushed screens, reached from a row or a chip ---- */
function screenBudgets() {
  const sp = engines.spend();
  const pacePct = Math.round((TODAY.day / TODAY.days) * 100);
  const rows = S.budgets.map((b) => {
    const p = engines.pace(b);
    const spentPct = Math.min(pct(p.spent, b.planned), 100);
    const overPct = p.lands > b.planned ? Math.min(pct(p.lands - b.planned, b.planned), 100 - spentPct) : 0;
    return `
      <div style="margin-top:14px">
        <button class="row" data-nav="txns" data-arg="${b.id}">
          <span><span class="name">${esc(b.name)}</span><span class="note">${money(p.spent)} of ${money(b.planned)} · lands at ${moneyR(p.lands)}</span></span>
          <span class="tag ${p.over ? 'warn' : ''}">${p.over ? 'over pace' : 'on pace'}</span>
        </button>
        <div class="bar"><i class="spent" style="width:${spentPct}%"></i><i class="over" style="width:${overPct}%"></i><i class="tick" style="left:${pacePct}%"></i></div>
      </div>`;
  }).join('');
  return `
    <div class="appbar"><button class="back" data-act="pop">←</button><h2>Budgets</h2><span class="note">${TODAY.month}</span></div>
    <div class="card flat">
      <p class="label">Planned this month</p>
      <p class="figure sm ${S.blur ? 'blurred' : ''}">${money(sp.planned)} · ${money(sp.left)} left</p>
      <p class="meaning">Alerts at 80% and 100%, once each. Nothing pings you about a coffee.</p>
    </div>
    <div class="card">${rows}</div>`;
}

function screenTxns() {
  const src = { manual: 'typed', receipt: 'from a receipt', sms: 'from a bank SMS' };
  // An argument filters the list to one envelope, which is how a budget row gets somewhere to go
  // without inventing a screen the app does not have.
  const envelope = S.budgets.find((b) => b.id === arg());
  const shown = envelope ? S.txns.filter((t) => t.cat === envelope.id) : S.txns;
  const rows = shown.map((t) => `
    <button class="row" data-nav="txn" data-arg="${S.txns.indexOf(t)}">
      <span><span class="name">${esc(t.merchant)}</span><span class="note">${esc(S.budgets.find((b) => b.id === t.cat)?.name || t.cat)} · ${t.nature} · ${src[t.src]}</span></span>
      <span style="text-align:right">${amt(-t.paise, 'neg')}<span class="note">${t.d} Oct</span></span>
    </button>`).join('');
  const spentHere = shown.reduce((sum, t) => sum + t.paise, 0);
  return `
    ${head(envelope ? envelope.name : 'Transactions', `${shown.length}`)}
    ${envelope ? `<div class="card flat">
      <p class="label">This envelope</p>
      <p class="figure sm ${S.blur ? 'blurred' : ''}">${money(spentHere)} of ${money(envelope.planned)}</p>
      <p class="meaning">At this pace ${TODAY.month} lands at ${moneyR(engines.pace(envelope).lands)}.</p>
    </div>` : ''}
    ${shown.length ? `<div class="card">${rows}</div>` : `<div class="empty">Nothing recorded${envelope ? ' in ' + esc(envelope.name) : ''} yet.</div>`}`;
}

      <div class="row"><span><span class="name">Market data</span><span class="note">${S.consents.market ? 'granted just now' : 'granted 4 Sep 2026 · revoked 2 Oct 2026'}</span></span><span class="tag">${S.consents.market ? 'on' : 'off'}</span></div>
      <div class="row"><span><span class="name">Cloud assistant</span><span class="note">never granted · no transport exists in this build</span></span><span class="tag">off</span></div>

/* ---------------------------------------------------------------------------
   Ask: the real split. A deterministic router picks an intent, engines supply
   the figures, and a template writes the sentence (P-03). Nothing here invents
   a number — which is why the figures always match the other screens.
--------------------------------------------------------------------------- */
function answer(question) {
  const q = question.toLowerCase();
  const refuse = ['reliance', 'stock', 'share', 'buy ', 'tax', 'file ', 'legal', 'tip'];
  if (refuse.some((w) => q.includes(w)) && !q.includes('afford')) {
    return { me: false, refused: true, text: "I can't pick investments or file taxes for you.",
      chips: ['out of scope · CHT-002'],
      work: [['why', 'That needs advice I am not registered to give'], ['instead', 'I can show whether today scores better than usual for your watched index']] };
  }
  const sp = engines.spend(), sts = engines.safeToSpend(), nw = engines.netWorth(), h = engines.health();
  if (q.includes('balance') || q.includes('have')) {
    return { me: false, text: `You have ${money(sts.left)} available to spend this month.`,
      chips: ['get_balance', 'AI-STS 1.3', 'checked'],
      work: [['left', `${money(sts.left)} of ${money(sp.planned)} planned`], ['model', 'template · wrote the words, not the figures']] };
  }
  if (q.includes('afford')) {
    const price = 4500000;
    const after = sts.left - price;
    // The sentence follows the figure. A negative remainder stated flatly reads like an
    // approval, which is exactly the kind of fluent wrongness the guardrail exists to stop.
    return { me: false,
      text: after >= 0
        ? `That would leave you with ${money(after)} for the rest of ${TODAY.month}.`
        : `Not this month — it is ${money(-after)} more than the ${money(sts.left)} you have left.`,
      chips: ['can_i_afford', 'AI-PA 1.2', 'checked'],
      work: [['price', money(price)], ['safe to spend', money(sts.left)],
        ['verdict', after >= 0 ? 'affordable, but it clears your buffer' : 'not affordable this month'],
        ['rule', 'RULE-PA-BUFFER v1.1']] };
  }
  if (q.includes('health') || q.includes('score')) {
    return { me: false, text: `Your financial health score is ${h.score} out of ${h.max}.`,
      chips: ['get_health_score', 'AI-FHS 1.1', 'checked'],
      work: [['band', h.band], ['biggest lever', h.lever], ['pillars', 'savings, debt, buffer, diversification, discipline']] };
  }
  if (q.includes('worth') || q.includes('net')) {
    return { me: false, text: `Your net worth is ${money(nw.total)} — ${moneyR(nw.own)} owned against ${moneyR(nw.owe)} owed.`,
      chips: ['get_net_worth', 'AI-NW 1.0', 'checked'], work: [['snapshot', `${TODAY.label}, taken on this device`]] };
  }
  return { me: false, text: `You spent ${money(sp.spent)} across ${sp.count} transactions this month.`,
    chips: ['query_spend', 'AI-STS 1.3', 'checked'],
    work: [['total', `${money(sp.spent)} — from your ledger, 1–${TODAY.day} Oct`], ['count', `${sp.count} transactions`], ['model', 'template · wrote the words, not the figures']] };
}

/* ---------------------------------------------------------------------------
   Shell: render, navigate, and the handful of interactions.
--------------------------------------------------------------------------- */
const SCREENS = {
  today: screenToday, money: screenMoney, plan: screenPlan, add: screenAdd, ask: screenAsk, you: screenYou,
  budgets: screenBudgets, txns: screenTxns, goals: screenGoals, forecast: screenForecast, consents: screenConsents,
  lock: screenLock, onboarding: screenOnboarding, health: screenHealth, insights: screenInsights,
  emergency: screenEmergency, advisor: screenAdvisor, buylist: screenBuylist, account: screenAccount,
  allocation: screenAllocation, nwhistory: screenNwHistory, txn: screenTxn, receipt: screenReceipt,
  smsreview: screenSmsReview, categories: screenCategories, recurring: screenRecurring, vehicle: screenVehicle,
  appliances: screenAppliances, insurance: screenInsurance, tax: screenTax, market: screenMarket,
  simulators: screenSimulators, backup: screenBackup, profiles: screenProfiles, index: screenIndex,
  orderofops: screenOrderOfOps, accounteditor: screenAccountEditor, holdings: screenHoldings,
  goaldetail: screenGoalDetail, erase: screenErase
};

function render() {
  const locked = S.lock && !S.erased;
  const name = locked ? 'lock' : here().screen;
  el('screen').innerHTML = S.erased ? screenErased() : (SCREENS[name] || screenToday)();
  // Tab bar and FAB go with the lock: a locked app shows nothing it could navigate to.
  el('tabs').hidden = locked;
  el('addfab').hidden = locked || S.erased || name === 'add';
  document.querySelectorAll('#tabs button').forEach((b) => {
    if (b.dataset.tab === nav.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  el('screen').scrollTop = 0;
}

/** Pushes a screen onto the current tab's stack. Input: [screen]; [value] — its argument. */
function go(screen, value = null) {
  if (TABS.includes(screen) && !nav.stacks[nav.tab].length) { switchTab(screen); return; }
  nav.stacks[nav.tab].push({ screen, arg: value });
  render();
}

/** Back, one level. Result: the tab's root once the stack empties. */
function back() { nav.stacks[nav.tab].pop(); render(); }

/** Switches tab, keeping every other tab's depth. Input: [tab]. */
function switchTab(tab) { nav.tab = tab; render(); }

/** Clears a tab's stack and shows it — after a save, an unlock or a reset. Input: [tab]. */
function reset(tab) { nav.stacks[tab] = []; nav.tab = tab; render(); }

/** Opens Add over whichever tab you were on, and remembers where to return. */
function openAdd() {
  draft = { digits: '', cat: draft.cat, acct: draft.acct, from: null, back: nav.tab };
  go('add');
}

function screenErased() {
  return `
    <div class="appbar"><h2>Erased</h2></div>
    <div class="empty">
      <p class="name">Everything is gone.</p>
      <p class="meaning">The key was destroyed first, so what is left on disk cannot be read — by this app or anything else.</p>
    </div>
    <button class="btn secondary" data-act="reset">Restore demo data</button>`;
}

function toast(text) {
  const t = el('toast');
  t.textContent = text; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1700);
}

function sheet(html) {
  const s = el('sheet');
  s.innerHTML = `<div>${html}</div>`;
  s.hidden = false;
}

function save() {
  const paise = Number(draft.digits || 0);
  if (!paise) return;
  S.txns.unshift({ d: TODAY.day, merchant: draft.from === 'receipt' ? 'More Supermarket' : 'Added by you',
    cat: draft.cat, paise, acct: draft.acct, nature: 'Want', src: draft.from || 'manual' });
  draft = { digits: '', cat: draft.cat, acct: draft.acct, from: null };
  reset(draft.back || 'today');
  toast(`Saved ${money(paise)} · every figure recomputed`);
}

el('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (b) switchTab(b.dataset.tab);
});

el('addfab').addEventListener('click', openAdd);

el('screen').addEventListener('click', (e) => {
  const t = e.target.closest('[data-act], [data-nav], [data-key], [data-cat], [data-acct], [data-ask], [data-toggle]');
  if (!t) return;
  const d = t.dataset;
  if (d.nav) { go(d.nav, d.arg || null); return; }
  if (d.key) {
    if (d.key === '⌫') draft.digits = draft.digits.slice(0, -1);
    else if (draft.digits.length < 9) draft.digits = String(Number(draft.digits + d.key));
    render(); return;
  }
  if (d.cat) { draft.cat = d.cat; render(); return; }
  if (d.acct) { draft.acct = d.acct; render(); return; }
  if (d.ask) { ask(d.ask); return; }
  if (d.toggle) {
    if (d.toggle === 'blur') S.blur = !S.blur;
    else S.consents[d.toggle] = !S.consents[d.toggle];
    render();
    toast(d.toggle === 'blur' ? (S.blur ? 'Amounts hidden everywhere' : 'Amounts shown')
      : `${d.toggle === 'sms' ? 'Bank SMS' : 'Market data'} ${S.consents[d.toggle] ? 'allowed — revocable any time' : 'revoked, and the record keeps both dates'}`);
    return;
  }
  switch (d.act) {
    case 'pop': back(); break;
    case 'unlock': S.lock = false; render(); toast('Unlocked · the database key came from the Keystore'); break;
    case 'lock': S.lock = true; reset('today'); break;
    case 'receipt-save':
      S.txns.unshift({ d: 12, merchant: S.receipt.merchant, cat: 'groceries', paise: S.receipt.total, acct: 'card', nature: 'Need', src: 'receipt' });
      reset(draft.back || 'today');
      toast(`Saved ${money(S.receipt.total)} from the receipt`);
      break;
    case 'sms-accept': {
      const m = S.smsQueue.splice(Number(d.i), 1)[0];
      if (m) S.txns.unshift({ d: TODAY.day, merchant: m.bank + ' alert', cat: m.cat, paise: m.paise, acct: 'card', nature: 'Want', src: 'sms' });
      render(); toast(`Added ${money(m ? m.paise : 0)} — you confirmed it, not the parser`);
      break;
    }
    case 'sms-reject':
      S.smsQueue.splice(Number(d.i), 1); render(); toast('Rejected · that message is never read again');
      break;
    case 'recat': toast('Changing it teaches the merchant rule (not in this prototype)'); break;
    case 'restore': toast('Needs the passphrase · nobody can reset it for you'); break;
    case 'profile': S.profile = d.p; render(); toast(`Switched to ${d.p} · nothing is merged`); break;
    case 'blur': S.blur = !S.blur; render(); toast(S.blur ? 'Amounts hidden everywhere' : 'Amounts shown'); break;
    case 'save': save(); break;
    case 'split': toast('Split across any number of categories (not in this prototype)'); break;
    case 'export': toast('One JSON archive, written to storage you choose'); break;
    case 'backup': toast('Argon2id → AES-256-GCM · the passphrase is never stored'); break;
    case 'erase':
      sheet(`<p class="name">Erase everything?</p>
        <p class="meaning">This destroys the database key, then the files. It cannot reach an archive you exported yourself. In the app you would type a word and your PIN.</p>
        <button class="btn danger" data-sheet="erase">Erase</button>
        <button class="btn secondary" data-sheet="cancel">Keep my data</button>`);
      break;
    case 'reset': S = seed(); S.lock = false; reset('today'); toast('Demo data restored'); break;
    default: break;
  }
});

el('screen').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = el('ask-input');
  if (input && input.value.trim()) ask(input.value.trim());
});

function ask(question) {
  S.chat.push({ me: true, text: question });
  S.chat.push(answer(question));
  reset('ask');
  const s = el('screen');
  s.scrollTop = s.scrollHeight;
}

el('sheet').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sheet]');
  if (!b && e.target.id !== 'sheet') return;
  el('sheet').hidden = true;
  if (b && b.dataset.sheet === 'erase') {
    S = seed(); S.erased = true; S.lock = false; reset('today');
    toast('Key destroyed · nine workers cancelled');
  }
});

render();
</script>
