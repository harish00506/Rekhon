# =============================================================================
# Version catalog — the SINGLE source of truth for the pinned §21.3 stack.
#
# Why:  Issue 1.1 / SRS §21.3 require one catalog pinning every dependency so no
#       module hardcodes a version and no library is swapped without an ADR (§9).
# What: [versions] pins, [libraries] coordinates (incl. Gradle-plugin artifacts the
#       build-logic convention plugins compile against), [plugins] plugin ids.
# Result: Every module script references `libs.…` aliases only; upgrades happen here.
# Changelog:
#   2026-07-19 — Created for issue 1.1 (Gradle multi-module skeleton). AGP 8.11 /
#                Kotlin 2.1 / Gradle 8.13 matrix; compileSdk 36.
# =============================================================================

[versions]
# --- Build toolchain (do not swap without an ADR) ---
agp = "8.11.1"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
javaToolchain = "17"

# --- SDK levels ---
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# --- AndroidX / Compose ---
androidxCore = "1.16.0"
androidxLifecycle = "2.9.1"
androidxActivity = "1.10.1"
composeBom = "2025.06.01"
navigationCompose = "2.9.1"

# --- Dependency injection ---
hilt = "2.56.2"
androidxHilt = "1.2.0"

# --- Persistence ---
room = "2.7.1"
datastore = "1.1.7"
protobuf = "4.31.1"
protobufPlugin = "0.9.5"
sqlcipher = "4.6.1"
sqlite = "2.5.1"

# --- Async / serialization ---
coroutines = "1.10.2"
serialization = "1.8.1"

# --- Network ---
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofitSerialization = "1.0.0"

# --- Background work ---
work = "2.10.1"

# --- ML / crypto / security ---
mlkitTextRecognition = "16.0.1"
tink = "1.17.0"
biometric = "1.2.0-alpha05"

# --- Home-screen widget ---
glance = "1.1.1"

# --- Quality tooling ---
ktlintPlugin = "12.1.2"
detekt = "1.23.8"
kover = "0.9.1"
paparazzi = "2.0.0-alpha02"
# Android Lint ships on its own track: lint version = AGP version + 23. Must track `agp` above
# or the custom detectors in :lint compile against a different API than the one running them.
lintVersion = "31.11.1"

# --- Testing ---
junit4 = "4.13.2"
androidxJunit = "1.2.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
turbine = "1.2.0"
truth = "1.4.4"
mockk = "1.14.2"

[libraries]
# --- Gradle-plugin artifacts (compiled against by build-logic convention plugins) ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintPlugin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

# --- Custom lint checks (:lint, issue 1.5) — compileOnly; the running lint supplies them ---
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lintVersion" }
lint-checks = { module = "com.android.tools.lint:lint-checks", version.ref = "lintVersion" }
lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lintVersion" }

# --- AndroidX core ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

# --- Compose (versions come from the BOM) ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Dependency injection ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# --- Room ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# Schema-bundle parsing (issue 1.7). A JVM artifact, so DB-003 can be checked in unit tests
# rather than only on a device.
room-migration = { module = "androidx.room:room-migration", version.ref = "room" }

# --- Encrypted store ---
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }

# --- DataStore ---
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
# Okio-backed storage: its atomicMove works on every host OS, unlike the default File rename
# path, which cannot replace an existing file on Windows (issue 1.9).
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

# --- Async / serialization ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- Network ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }

# --- Background work ---
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- ML Kit ---
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }

# --- Crypto / security ---
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
androidx-biometric = { module = "androidx.biometric:biometric-ktx", version.ref = "biometric" }

# --- Home-screen widget (Glance) ---
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }

# --- Testing ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
# AndroidJUnitRunner itself: without it the instrumentation runs and discovers zero tests.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
# --- Upstream plugins (applied by the build-logic convention plugins) ---
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }

# --- Convention plugins (defined in build-logic/) ---
cfo-kotlin-library = { id = "cfo.kotlin.library" }
cfo-android-library = { id = "cfo.android.library" }
cfo-android-application = { id = "cfo.android.application" }
cfo-android-compose = { id = "cfo.android.compose" }
cfo-android-feature = { id = "cfo.android.feature" }
cfo-hilt = { id = "cfo.hilt" }
