# =============================================================================
# CI — the maintenance workflow (SRS §21.3: "main is always releasable").
#
# Why:  Every PR into an integration/release branch must build, be tested, be
#       lint-clean, and enforce the architecture invariants — the SRS pins GitHub
#       Actions for exactly this. This is the automated gate that /pre-merge mirrors.
# What: convention/ARC-002 tests · build · unit + coverage · ktlint/detekt/android-lint ·
#       OSV scan · assemble · release log-strip check. No step depends on the app's backend
#       (P-04); the OSV scan needs the public advisory API, which is tooling, not the app.
# Result: A red pipeline blocks the merge; a green one means the branch stayed releasable.
# Changelog:
#   2026-07-17 — Created from SRS v1.7 §21.3, §21.5, §21.6, SEC-007.
#   2026-07-19 — Issue 1.1: wired to the real Gradle tasks (skeleton now exists). Added
#                dev/stage triggers, Android SDK setup, and the ARC-002 convention tests.
#                OSV scan (issue 11.6) lands with its issue.
#   2026-07-25 — Issue 1.8: Paparazzi screenshot diff enabled (JVM, no emulator required).
#   2026-09-19 — Issue 8.3: the `restore-drill` job — the backup restore drill on an emulator,
#                required for every promotion into `stage` or `main` (§21.5, DRL-001).
#   2026-10-02 — Issue 11.6: the OSV dependency scan and the release log-strip verification, both
#                able to fail the build. The scan replaces a placeholder that suggested `|| true`.
#   2026-10-02 — Issue 12.2: the `aiEval` step, so an accuracy regression reads as the dataset that
#                regressed rather than as one of five thousand anonymous tests.
#   2026-10-02 — Issue 12.4: `offlineSmoke` joins the emulator job. `:app:connectedDebugAndroidTest`
#                had never run in CI, and no test had ever turned airplane mode on (P-04).
#   2026-10-03 — Issue 12.5: `verifyReleaseMetadata`, so a version bump that disagrees with the
#                changelog or the versionCode ledger fails here rather than at the Play console.
# =============================================================================
name: CI

on:
  push:
    branches: [main, stage, dev]
  pull_request:
    branches: [main, stage, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate AI data files (ai/**)
        # The app LOADS these; a broken rulebook/knowledge file is a release blocker.
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = False
          for f in glob.glob("ai/**/*.json", recursive=True):
              try: json.load(open(f, encoding="utf-8"))
              except Exception as e: bad = True; print(f"::error file={f}::{e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        # compileSdk 36 (§21.3 pinned stack) + tools AGP needs to assemble/lint.
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release metadata — VERSION · versionCode · CHANGELOG (§26, SemVer)
        # Issue 12.5. These three are bumped by hand on every issue and nothing checked they agree.
        # They had already drifted twice: Epic 11's seven issues shipped in the 0.10.x series, and ten
        # versions shipped with a versionCode that did not increase — which Play rejects at upload,
        # after the release is cut. Cheap, so it runs first: a bad bump fails in seconds rather than
        # after the emulator job.
        run: ./gradlew verifyReleaseMetadata --stacktrace

      - name: Convention plugins · ARC-002 guard (TestKit)
        # Enforces the module-boundary invariant (ARC-002) before anything else.
        run: ./gradlew -p build-logic :convention:test --stacktrace

      - name: ktlint · detekt · Android lint
        run: ./gradlew ktlintCheck detekt lintDebug --stacktrace

      - name: Unit tests (+ coverage; money math must be 100%)
        # `unitTests`, not `testDebugUnitTest` (issue 2.6). The latter is an Android *variant* task,
        # so it does not exist on the pure-Kotlin modules and — critically — never reached `:lint`.
        # That left the fourteen tests covering the custom detectors (MNY-001, TIM-001, ARC-006, the
        # PII-logging ban, the hardcoded-string ban) running in no CI step at all: a detector could
        # be disabled outright and this job would stay green while the rules quietly stopped being
        # enforced. Demonstrated by disabling MoneyDoubleDetector — `testDebugUnitTest` passed.
        run: ./gradlew unitTests koverVerify --stacktrace

      - name: Frozen AI evaluation sets (§21.5 accuracy floors)
        # Issue 12.2. These run inside `unitTests` above too — that is what blocks the merge. This
        # step exists so the pipeline *names* the gate and so the accuracy lines each runner prints
        # are findable in the log: categorisation ≥ 92%, receipts ≥ 95%, SMS ≥ 95%, and the forecast
        # backtest's bounds. Every line carries the dataset revision that produced it, so a score can
        # be compared with one recorded last month rather than taken on trust.
        run: ./gradlew aiEval --stacktrace

      - name: Chat guardrail evaluation (AI-ARC-004, §21.5)
        # Issue 10.6. The frozen set in `ai/eval/guardrail-eval.json` runs inside `unitTests` above
        # — this step exists so the pipeline *names* the gate, and so a failure reads as "the
        # guardrail regressed" rather than as one of four thousand anonymous tests. The threshold is
        # absolute on the side that matters: every fabricated or adversarial figure must be blocked.
        run: ./gradlew guardrailEval --stacktrace

      - name: Paparazzi screenshot diff
        # Wired by issue 1.8. Renders on the JVM, so no emulator is needed — which is the only
        # reason this project has any visual coverage at all.
        run: ./gradlew verifyPaparazziDebug --stacktrace
      - name: Dependency vulnerability scan (OSV, SEC-007)
        # Issue 11.6. Deliberately **not** `|| true`, which the placeholder this replaced suggested:
        # a scan that cannot fail is the vacuous gate this repository keeps finding. The script exits
        # 1 on a HIGH/CRITICAL finding that is not allowlisted, 1 on an allowlist entry past its
        # review date, and 2 when it cannot reach OSV — none of which is a pass.
        run: ./gradlew scanDependencies --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Release hardening — R8 + the log strip (§21.6, SEC-007)
        # Issue 11.6. Assembles the minified release and then reads the shipped DEX: §21.6's "no PII
        # or amounts in logs" is enforced in release by removing `Log.v/d/i/w`, `isLoggable` and
        # `println` outright, and that is a claim about a binary. The rule file can be edited and
        # `isMinifyEnabled` can be flipped back with every other check here staying green, so the
        # APK itself is inspected. Proven non-vacuous: the same checker fails on the debug APK.
        run: ./gradlew verifyReleaseLogStripping --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Issue 8.3 (§21.5, §34.4 DRL-001): the backup restore drill, on a real emulator.
  #
  # Why:  `verify` already runs the JVM drill on every PR (it is in `unitTests`). A release ships
  #       SQLCipher and Android's crypto providers, though, and the drill that gates a release must
  #       run on those — so every promotion into `stage` or `main` seals a backup from a database
  #       with a row in every table, destroys the database and its key, and restores onto a clean
  #       one. Any difference, table by table, fails this job and blocks the promotion.
  # What: `./gradlew restoreDrill` (= `:data:repository:connectedDebugAndroidTest`) on an API 34
  #       x86_64 emulator. Only on the release path: an emulator run costs minutes, and `dev` is
  #       covered by the JVM drill.
  # Enforcement: GitHub branch protection on `stage` and `main` must list this job as a required
  #       check. That is repository configuration, not something this file can set — see
  #       `docs/issues/00-issue-workflow.md`, "Release gate".
  restore-drill:
    name: Backup restore drill + offline E2E (release gate)
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'stage' || github.base_ref == 'main')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        # Hardware acceleration for the emulator; without it the x86_64 image is too slow to boot.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore drill + offline end-to-end smoke on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Issue 12.4 adds `offlineSmoke` beside the drill. It runs `:app:connectedDebugAndroidTest`,
          # which until now ran in **no** CI job at all — the Definition of Done named it and nothing
          # executed it. Its offline leg turns airplane mode on through the shell, drives the core
          # flow, and restores the radio in @After even on failure. `restoreDrill` stays named
          # separately because DRL-001 makes it a release gate in its own right (issue 8.3).
          script: ./gradlew restoreDrill offlineSmoke --stacktrace

      - name: Upload drill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill
          path: data/repository/build/outputs/androidTest-results/**
          if-no-files-found: ignore
