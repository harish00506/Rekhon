# =============================================================================
# Gradle build properties (issue 1.1).
# Why: consistent, reproducible builds for every agent/human and CI (§21.6).
# =============================================================================

# JVM: enough heap for a multi-module Android build; UTF-8 for deterministic output.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Faster local + CI builds.
org.gradle.parallel=true
org.gradle.caching=true

# Config cache stays off for the skeleton to keep convention-plugin behaviour obvious;
# enabled later once the build stabilises.
org.gradle.configuration-cache=false

# AndroidX only (Support Library is retired).
android.useAndroidX=true

# Smaller R classes + faster incremental builds.
android.nonTransitiveRClass=true

# Kotlin official code style (matches ktlint --android=false baseline in .editorconfig).
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
